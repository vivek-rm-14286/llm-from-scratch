# Sample GitHub Actions workflow: copy to .github/workflows/eval-gate.yml to enable it.
# Fails the pull request when retrieval leaks a chunk above the asker's access level, when
# recall@5 or MRR of any retrieval mode drops more than 0.02 below ci/baseline.json, or when the
# red-team run shows an access leak or more attacks getting past the guardrails than allowed.
# No LLM endpoint and no GPU are needed: retrieval metrics are deterministic and the red-team
# job uses the built-in fake model.
name: rag-eval-gate

on:
  pull_request:
    paths:
      - "code/support_rag/**"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/support_rag
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/support_rag/requirements.txt
      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2
      - name: Install (CPU-only torch keeps the job small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Golden set is consistent with the corpus
        run: |
          python build_sample_data.py
          git diff --exit-code -- sample_data
      - name: Retrieval eval gate (ACL leaks, recall and MRR vs baseline)
        run: python eval.py --reingest --baseline ci/baseline.json --max-drop 0.02
      - name: Red-team gate (fake model)
        run: python redteam.py --fake-llm --max-asr 0.10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            code/support_rag/eval_report.json
            code/support_rag/redteam_report.json
